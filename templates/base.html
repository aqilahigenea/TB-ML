<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSS Stunting Kota Padang - Kelompok 8</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .badge-t1 { background-color: #dc3545; color: white; }
        .badge-t2 { background-color: #fd7e14; color: white; }
        .badge-t3 { background-color: #198754; color: white; }
        .card-stat { border-radius: 12px; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-heart-pulse-fill me-2"></i>DSS Stunting Padang
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard Acuan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/upload"><i class="bi bi-cloud-arrow-up-fill me-1"></i> Unggah Data Baru</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/informasi-model"><i class="bi bi-info-circle-fill me-1"></i> Informasi Model</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light btn-sm text-primary fw-bold mt-1" href="/ekspor">
                            <i class="bi bi-file-earmark-excel-fill me-1"></i> Unduh Excel
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            <div><strong>Tugas Besar Machine Learning — Kelompok 8 Universitas Andalas</strong> &copy; 2026</div>
            <div class="text-secondary mt-1">Dhyva Aulia Hendri &bull; Madani Fitri Nur Hidayati &bull; Aqila Higenea Taufik</div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
